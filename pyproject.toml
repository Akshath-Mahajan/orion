[build-system]
requires = ["poetry-core>=1.0.2", "setuptools>=61.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "orion-fhe"
version = "1.0.2"
description = "A Fully Homomorphic Encryption Framework for Deep Learning"
authors = [
    {name = "Austin Ebel", email = "abe5240@nyu.edu"}
]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.30.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0,<=1.14.1",
    "matplotlib>=3.1.0",
    "h5py>=3.5.0",
    "certifi>=2024.2.2",
]

# Optional extras. Install with `pip install orion-fhe[bench-gpu]`.
# bench-gpu pulls in NVML bindings used by the matmul-encoding D7
# harness (benchmarks/matmul_encodings/runners/gpu_sampler.py) for
# peak HBM + per-kernel energy measurement. The package is the
# official Nvidia-maintained NVML wrapper.
[project.optional-dependencies]
bench-gpu = ["nvidia-ml-py>=12.0"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (bootstrap, large params)"]
addopts = "-m 'not slow'"

[tool.poetry]
packages = [{include = "orion"}]

[tool.poetry.build]
generate-setup-file = true
script = "tools/build_lattigo.py"
